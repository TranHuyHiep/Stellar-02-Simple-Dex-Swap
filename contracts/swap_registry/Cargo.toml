[package]
name = "swap_registry"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "23.0.2"

[dev-dependencies]
soroban-sdk = { version = "23.0.2", features = ["testutils"] }
# Only for the cross-contract integration tests: they register the real vault
# in the test host rather than a stub, so the two contracts are exercised
# together exactly as they are on-chain.
fee_vault = { path = "../fee_vault" }
